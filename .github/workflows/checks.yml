name: Software checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment and packaged application
        run: uv sync --locked --no-editable
      - name: Check Python mistakes and import order
        run: uv run --no-sync ruff check src scripts tests experiments
      - name: Check Python formatting
        run: uv run --no-sync ruff format --check src scripts tests experiments
      - name: Run tests and check Python syntax and installed assets
        run: uv run --no-sync python scripts/check_project.py --require-installed --output results/checks/ci/checks.json
      - name: Prepare a synthetic model for the container check
        run: |
          uv run --no-sync python scripts/prepare_ci_fixture.py
          uv run --no-sync python scripts/prepare_container.py --project-root build/ci-fixture --results-dir results/ci --output-dir container
      - name: Build the container with the synthetic model
        run: docker build --build-arg BUNDLE_DIR=build/ci-fixture/container --tag kidney-biopsy:ci .
      - name: Check container readiness, predictions, and invalid input
        run: uv run --no-sync python scripts/verify_container.py --image kidney-biopsy:ci --bundle-dir build/ci-fixture/container --output results/checks/ci/container.json
      - name: Preserve the check record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: software-checks
          path: results/checks/ci/*.json
          if-no-files-found: warn
          retention-days: 14
