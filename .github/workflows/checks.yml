name: Software checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment and packaged application
        run: uv sync --frozen --no-editable
      - name: Run tests and check Python syntax and installed assets
        run: uv run --no-sync python scripts/check_project.py --require-installed --output results/checks/ci/checks.json
      - name: Preserve the check record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: software-checks
          path: results/checks/ci/checks.json
          if-no-files-found: warn
          retention-days: 14
